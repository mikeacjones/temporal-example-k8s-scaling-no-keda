apiVersion: v2
name: temporal-worker-hpa
description: Versioned Temporal workers with Prometheus and native Kubernetes HPA
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.30.0-0"
dependencies:
  - name: prometheus
    version: "29.48.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: prometheus-adapter
    alias: adapter
    version: "5.4.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: adapter.enabled
